[project]
name = "holdem-bot"
version = "0.0.0"
description = "Screen recognition and automation bot"
requires-python = ">=3.12"
dependencies = [
    "holdem-ai",
    "holdem-common",
]

[tool.uv.sources]
holdem-ai = { workspace = true }
holdem-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_bot"]
