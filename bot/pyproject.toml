[project]
name = "holdem-bot"
version = "0.0.0"
description = "Screen recognition and automation bot"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "holdem-ai",
    "holdem-common",
    "mss>=10.2",
    "openai>=2.0",
    "opencv-python>=4.13.0.92",
    "pytesseract>=0.3.13",
]

[project.scripts]
holdem-bot-apply-poker-legends-layout = "holdem_bot.vision.poker_legends_layout:main"
holdem-bot-capture-macos-screen = "holdem_bot.adapters.poker_legends_host:capture_main"
holdem-bot-evaluate-fixture = "holdem_bot.vision.evaluate:main"
holdem-bot-build-poker-legends-truth = "holdem_bot.vision.poker_legends_truth:main"
holdem-bot-build-poker-legends-card-classifier = "holdem_bot.vision.poker_legends_card_classifier:main"
holdem-bot-evaluate-poker-legends-card-consensus = "holdem_bot.vision.poker_legends_card_consensus:main"
holdem-bot-evaluate-poker-legends-numbers = "holdem_bot.vision.poker_legends_numbers:main"
holdem-bot-build-poker-legends-card-part-templates = "holdem_bot.vision.poker_legends_card_parts:main"
holdem-bot-build-poker-legends-card-templates = "holdem_bot.vision.poker_legends_cards:main"
holdem-bot-build-poker-legends-button-templates = "holdem_bot.vision.poker_legends_buttons:main"
holdem-bot-build-poker-legends-multi-templates = "holdem_bot.vision.poker_legends_multi_templates:main"
holdem-bot-select-poker-legends-card-review-candidates = "holdem_bot.vision.poker_legends_card_review:main"
holdem-bot-compare-poker-legends-recognition = "holdem_bot.vision.poker_legends_compare:main"
holdem-bot-evaluate-poker-legends-screen-state = "holdem_bot.vision.poker_legends_screen:main"
holdem-bot-scan-poker-legends-screen-state = "holdem_bot.vision.poker_legends_screen_scan:main"
holdem-bot-build-poker-legends-session-timeline = "holdem_bot.vision.poker_legends_session:main"
holdem-bot-ingest-video = "holdem_bot.vision.video:main"
holdem-bot-llm-annotate = "holdem_bot.vision.llm_annotation:main"
holdem-bot-plan-poker-legends-click = "holdem_bot.adapters.poker_legends_host:plan_click_main"
holdem-bot-run-poker-legends-dry-run = "holdem_bot.adapters.poker_legends_host:dry_run_once_main"
holdem-bot-replay-poker-legends-dry-run = "holdem_bot.adapters.poker_legends_host:replay_dry_run_main"
holdem-bot-watch-poker-legends = "holdem_bot.adapters.poker_legends_host:watch_main"
holdem-bot-select-keyframes = "holdem_bot.vision.selection:main"

[tool.uv.sources]
holdem-ai = { workspace = true }
holdem-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_bot"]
