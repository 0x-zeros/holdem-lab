[project]
name = "holdem-ai"
version = "0.0.0"
description = "Texas Hold'em decision engines"
requires-python = ">=3.12"
dependencies = [
    "holdem-common",
]

[tool.uv.sources]
holdem-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_ai"]
