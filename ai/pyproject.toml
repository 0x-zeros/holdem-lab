[project]
name = "holdem-ai"
version = "0.0.0"
description = "Texas Hold'em decision engines"
requires-python = ">=3.12"
dependencies = [
    "holdem-common",
    "holdem-engine",
    "open-spiel>=1.6.15",
]

[tool.uv.sources]
holdem-common = { workspace = true }
holdem-engine = { workspace = true }

[project.scripts]
holdem-ai-evaluate-heads-up = "holdem_ai.evaluate:main"
holdem-ai-train-cfr = "holdem_ai.cfr:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_ai"]
