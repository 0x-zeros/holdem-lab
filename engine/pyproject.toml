[project]
name = "holdem-engine"
version = "0.0.0"
description = "Texas Hold'em rules facade and environment"
requires-python = ">=3.12"
dependencies = [
    "holdem-common",
    "pokerkit>=0.7.4",
]

[tool.uv.sources]
holdem-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_engine"]
