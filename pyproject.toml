[project]
name = "holdem-lab"
version = "0.0.0"
description = "Texas Hold'em game + poker AI + Steam CV bot (Python monorepo)"
requires-python = ">=3.12"
dependencies = [
    "holdem-ai",
    "holdem-bot",
    "holdem-common",
    "holdem-engine",
    "holdem-game",
]

# Repo root is a non-package: uv manages one shared venv but does not try to build this dir.
[tool.uv]
package = false

[tool.uv.sources]
holdem-ai = { workspace = true }
holdem-bot = { workspace = true }
holdem-common = { workspace = true }
holdem-engine = { workspace = true }
holdem-game = { workspace = true }

[tool.uv.workspace]
members = [
    "common",
    "engine",
    "ai",
    "game",
    "bot",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Archived equity calculator is not part of the Python rebuild.
extend-exclude = ["equity-calculator", ".local", ".venv-docker", ".venv-mac"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = '^(equity-calculator|\.local)/'
