[project]
name = "holdem-game"
version = "0.0.0"
description = "pygame Texas Hold'em table"
requires-python = ">=3.12"
dependencies = [
    "holdem-ai",
    "holdem-common",
    "holdem-engine",
    "pygame>=2.6.1",
]

[project.scripts]
holdem-game = "holdem_game.app:main"

[tool.uv.sources]
holdem-ai = { workspace = true }
holdem-common = { workspace = true }
holdem-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holdem_game"]
